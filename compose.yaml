services:
  climate-reporting:
    build: .
    image: cerezas-climate-reporting:local
    container_name: climate-reporting
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      CEREZAS_CONFIG_DIR: /app/config
      CEREZAS_ASSETS_DIR: /app/assets
      CEREZAS_DATA_ROOT: /data
    volumes:
      - "${CEREZAS_DATA_HOST_PATH:-/home/uoh/cerezas_web_server/data/climate-reporting}:/data"
      - "${CEREZAS_CONFIG_HOST_PATH:-./config}:/app/config:ro"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
