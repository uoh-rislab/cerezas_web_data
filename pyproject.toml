[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerezas-web-data"
version = "0.1.0"
description = "Pipeline automatizado de reportería climática UOH Cerezas"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.8,<4",
  "meteostat>=1.6,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pymongo>=4.6,<5",
  "PyYAML>=6,<7",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
cerezas-pipeline = "cerezas_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
