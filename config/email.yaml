enabled: false
# Options: smtp or gmail_api.
delivery_method: smtp
timezone: America/Santiago
send_hour: 5
send_minute: 0
retry_minutes: 30

sender:
  display_name: UOH Cerezas
  email: cerezas@uoh.cl
  delegated_user: ""
  service_account_file: /run/secrets/gmail-service-account.json

# Default delivery method: Gmail SMTP + App Password.
# Store the App Password outside Git in the service .env as GMAIL_APP_PASSWORD.
smtp:
  host: smtp.gmail.com
  port: 587
  username: cerezas@uoh.cl
  password_env: GMAIL_APP_PASSWORD
  password_file: ""
  use_starttls: true
  timeout_seconds: 30

global_cc: []
#  - name: Daniel Casagrande
#    email: daniel.casagrande@uoh.cl
#  - name: Jaime Varas
#    email: jaime.varas@uoh.cl
#  - name: Luis Gustavo Cossio Montefinale
#    email: luis.cossio@uoh.cl

# Each generated PDF is sent separately using its site ID.
# Add primary recipients under `to`; site-specific `cc` entries are appended to global_cc.
sites:
